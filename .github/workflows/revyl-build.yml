
name: Revyl Build
on:
  pull_request:
  workflow_dispatch:

jobs:
  ios-sim:
    name: iOS Simulator Build
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Pod install
        run: cd ios && pod install --repo-update
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -workspace "ios/RocketChatRN.xcworkspace" \
            -scheme "RocketChatRN" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
      - name: Locate .app bundle
        id: locate
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name "*.app" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: revyl-ios-app
          path: ${{ steps.locate.outputs.app_path }}
          if-no-files-found: error

  android-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: yarn install --frozen-lockfile
      - name: Build debug APK
        run: cd android && ./gradlew assembleAppDebug
      - uses: actions/upload-artifact@v4
        with:
          name: revyl-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
