name: Revyl Build
on:
  pull_request:
  workflow_dispatch:

jobs:
  ios-sim:
    name: iOS Simulator Build
    runs-on: macos-15
    timeout-minutes: 120
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - name: Select Xcode 16
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_16" ]; then
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          xcodebuild -version
      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document
      - name: Pod install
        run: cd ios && pod install --repo-update
        timeout-minutes: 30
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -workspace "ios/RocketChatRN.xcworkspace" \
            -scheme "RocketChatRN" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
      - name: Locate .app bundle
        id: locate
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -type d -name "*.app" | head -n 1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: revyl-ios-app
          path: ${{ steps.locate.outputs.app_path }}
          if-no-files-found: error

  android-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - run: yarn install --frozen-lockfile
      - name: Build debug APK
